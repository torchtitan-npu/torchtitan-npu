name: A3-8p-CI-Example

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_cases:
        description: JSON list of test_id or suite selectors
        type: string
        required: true
        default: '[{"suite":"a3_8p_tests"}]'

permissions:
  contents: read
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/lite_actions_common.yml
    with:
      pipeline: a3-8p
      default_cases: '[{"suite":"a3_8p_tests"}]'
      test_cases: ${{ inputs.test_cases }}
