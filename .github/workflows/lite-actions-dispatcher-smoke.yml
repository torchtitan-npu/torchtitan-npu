name: Dispatcher-Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-2p-ci
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'torchtitan-npu/torchtitan-npu' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ubuntu-latest
    # Phase 1 serial queue can place smoke behind long training runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Wait for dispatcher-only npu-smi probe
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_TIMEOUT_SECONDS: "4800"
        run: python3 .github/scripts/lite_actions/wait_result.py --case a3-smoke
