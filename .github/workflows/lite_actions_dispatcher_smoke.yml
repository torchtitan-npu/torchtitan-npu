name: Dispatcher-Smoke

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/lite_actions_common.yml
    with:
      pipeline: dispatcher-smoke
      wait_seconds: 4800
