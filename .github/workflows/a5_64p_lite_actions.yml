name: A5-64p-CI

on:
  workflow_dispatch:
    inputs:
      test_cases:
        description: JSON list of test_id or suite selectors
        type: string
        required: true
        default: '[{"suite":"a5_64p_tests"}]'

permissions:
  contents: read
  actions: read

jobs:
  ci:
    # A5 hardware is unavailable; keep this gate disabled.
    if: ${{ false }}
    uses: ./.github/workflows/lite_actions_common.yml
    with:
      pipeline: a5-64p
      default_cases: '[{"suite":"a5_64p_tests"}]'
      test_cases: ${{ inputs.test_cases }}
